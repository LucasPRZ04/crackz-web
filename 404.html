<style>@font-face{font-family:Anton;src:url(/fonts/anton.woff2) format('woff2');font-display:swap}@font-face{font-family:Inter;font-weight:400 500;src:url(/fonts/inter-400.woff2) format('woff2');font-display:swap}@font-face{font-family:Inter;font-weight:600;src:url(/fonts/inter-600.woff2) format('woff2');font-display:swap}@font-face{font-family:Inter;font-weight:700;src:url(/fonts/inter-700.woff2) format('woff2');font-display:swap}@font-face{font-family:Inter;font-weight:800 900;src:url(/fonts/inter-900.woff2) format('woff2');font-display:swap}</style>
<style>
  :root{--bg:#0B0F14;--s:#151B23;--line:#232B36;--t:#F2F5F7;--m:#9AA6B2;--lime:#C8FF3E;--gold:#E9C46A;--red:#FF7B6B}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;background:radial-gradient(120% 60% at 50% 0%,rgba(200,255,62,.16),rgba(11,15,20,0) 60%),var(--bg)}
  .wrap{max-width:460px;margin:0 auto;padding:20px 18px calc(40px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .top img{width:34px;height:34px}
  .brand{font-family:Anton,sans-serif;font-size:26px;letter-spacing:2px}
  .card{background:rgba(21,27,35,.78);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:20px;margin-bottom:14px;backdrop-filter:blur(8px)}
  .hero{background:linear-gradient(135deg,#1B2A12,#0F1A14);border-color:rgba(200,255,62,.22)}
  .eyebrow{color:var(--lime);font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase}
  .big{font-family:Anton,sans-serif;font-size:40px;line-height:1.05;margin:8px 0 6px;text-transform:uppercase}
  .muted{color:var(--m);font-size:14px;line-height:1.45}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin:14px 0 8px}
  .bar i{display:block;height:100%;background:var(--lime);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .pill{display:inline-block;background:var(--lime);color:var(--bg);font-weight:900;font-size:12px;padding:4px 10px;border-radius:999px}
  .pill.gold{background:var(--gold)}
  .pill.red{background:var(--red)}
  a{color:var(--lime);text-decoration:none;font-weight:600}
  .players{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .pl{display:flex;align-items:center;gap:12px;min-height:40px;animation:in .4s both}
  .rt{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:Anton,sans-serif;font-size:16px;color:#0E131A;flex-shrink:0}
  .nm{flex:1;font-weight:600;font-size:15px}
  .tag{font-size:11px;color:var(--m);font-weight:600}
  .lbl{color:var(--lime);font-size:11px;font-weight:700;letter-spacing:1.6px;margin-bottom:10px;display:block}
  input{width:100%;height:54px;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--t);font:500 17px Inter,sans-serif;padding:0 16px;outline:none}
  input:focus{border-color:var(--lime)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
  .chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--t);font:600 14px Inter;cursor:pointer}
  .chip.on{background:var(--t);color:var(--bg);border-color:var(--t)}
  .btn{width:100%;height:56px;border-radius:16px;border:0;font:700 17px Inter,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
  .btn:active{transform:scale(.97)}
  .prim{background:var(--lime);color:var(--bg);box-shadow:0 8px 24px rgba(200,255,62,.3)}
  .sec{background:rgba(255,255,255,.06);color:var(--t);border:1px solid rgba(255,255,255,.1);margin-top:10px}
  .btn[disabled]{opacity:.5}
  .err{color:var(--red);font-size:14px;margin-top:10px;min-height:18px}
  .ok{text-align:center}
  .ok .big{color:var(--lime)}
  .app{display:flex;gap:14px;align-items:center}
  .app img{width:52px;height:52px;border-radius:14px;background:#000}
  .sk{height:16px;border-radius:8px;background:rgba(255,255,255,.06);margin:10px 0}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}
</style>
</head>

function fecha(iso) {
  const d = new Date(iso), hoy = new Date(), man = new Date(); man.setDate(hoy.getDate() + 1);
  const h = `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
  if (d.toDateString() === hoy.toDateString()) return `Hoy · ${h}`;
  if (d.toDateString() === man.toDateString()) return `Mañana · ${h}`;
  return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]} · ${h}`;
}
function tier(r) {

}

}

        <p class="muted" style="font-size:13px">En la app te votan tus compis, subes de media y desbloqueas tu personaje.</p>

  app.querySelectorAll('.chip').forEach(b => b.onclick = () => { pos = pos === b.dataset.p ? null : b.dataset.p; app.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.p === pos)); });
  const go = document.getElementById('go');
  if (go) go.onclick = apuntarme;
  const nm = document.getElementById('nm');
  if (nm) nm.onkeydown = e => { if (e.key === 'Enter') apuntarme(); };
  const salir = document.getElementById('salir');
  if (salir) salir.onclick = async () => {
    if (!confirm('¿Seguro que te borras del partido?')) return;
    try { await rpc('web_leave', { c: code, t: tk }); localStorage.removeItem(yaKey); await cargar(); } catch (e) { alert(e.message); }
  };
}

async function apuntarme() {
  const nm = document.getElementById('nm').value.trim(), err = document.getElementById('err'), go = document.getElementById('go');
  if (nm.length < 2) { err.textContent = 'Pon tu nombre para que sepan quién eres.'; return; }
  go.disabled = true; go.textContent = 'Apuntando…'; err.textContent = '';
  try {
    await rpc('web_join', { c: code, name: nm, t: tk, pos });
    localStorage.setItem(yaKey, '1'); localStorage.setItem('crackz_nombre', nm);
    await cargar(); confeti(); window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) { err.textContent = e.message; go.disabled = false; go.textContent = '⚽ Me apunto'; }
}

function compartir() {
  const txt = `⚽ Pachanga ${fecha(M.starts_at).toLowerCase()}${M.location ? ' en ' + M.location : ''}. Somos ${M.players.length}/${M.max_players}. Apúntate aquí: ${location.href}`;
  if (navigator.share) navigator.share({ text: txt }).catch(() => {});
  else location.href = 'https://wa.me/?text=' + encodeURIComponent(txt);
}

async function cargar() {
  if (!code) { M = null; return render(); }
  try { M = await rpc('public_match', { c: code }); } catch { M = null; }
  render();
}
cargar();
// se actualiza solo si la tienes abierta
setInterval(() => { if (!document.hidden && document.activeElement?.tagName !== 'INPUT' && !document.getElementById('nm')?.value) cargar(); }, 30000);
</script>
